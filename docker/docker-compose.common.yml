services:
  application:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        DEV_DEPS: true
    env_file:
      - ../.env
    environment:
      DJANGO_LOG_LEVEL: DEBUG
      DJANGO_ENV: development
      IN_DOCKER: "false"
      TZ: Europe/Riga
    cap_add:
      - SYS_PTRACE
    volumes:
      - type: bind
        source: ../memray
        target: /app/memray
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
            - .ruff_cache/
            - __pycache__/
            - .cache/
            - .mypy_cache/
        - action: rebuild
          path: ./pyproject.toml
    depends_on:
      redis-master:
        condition: service_healthy
      redis-sentinel:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
