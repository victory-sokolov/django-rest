# Prometheus Stack Configuration
kube-prometheus-stack:
  # Common labels for all resources
  commonLabels:
    release: prometheus

  # Prometheus Configuration
  prometheus:
    prometheusSpec:
      retention: 15d
      retentionSize: 50GB
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 1000m
          memory: 4Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: standard
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector:
        matchLabels:
          release: prometheus

  # Grafana Configuration
  grafana:
    enabled: true
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: standard
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    adminPassword: changeme
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
      datasources:
        enabled: true
        defaultDatasourceEnabled: true
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default

  # Node Exporter
  prometheus-node-exporter:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Kube-State-Metrics
  kube-state-metrics:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

  # Default dashboards
  defaultDashboardsEnabled: true

  # Disable alertmanager (can be enabled later)
  alertmanager:
    enabled: false
