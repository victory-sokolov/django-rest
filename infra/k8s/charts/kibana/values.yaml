# Kibana Configuration
kibana:
  # Use matching image version
  image: "docker.elastic.co/kibana/kibana"
  imageTag: "8.12.0"

  # Resource limits
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  # Elasticsearch connection
  elasticsearchHosts: "http://elasticsearch-master:9200"

  # Kibana configuration
  kibanaConfig:
    kibana.yml: |
      server.name: kibana
      server.host: "0.0.0.0"
      monitoring.ui.container.elasticsearch.enabled: true

  # Disable security for development (enable for production)
  security:
    enabled: false

  # Persistent storage (optional for Kibana)
  persistence:
    enabled: false
