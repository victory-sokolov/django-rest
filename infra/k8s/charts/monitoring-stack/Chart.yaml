apiVersion: v2
name: monitoring-stack
description: Umbrella chart that aggregates monitoring subcharts (prometheus, elasticsearch, kibana)
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: prometheus
    version: "1.0.0"
    repository: "file://../prometheus"
  - name: elasticsearch
    version: "1.0.0"
    repository: "file://../elasticsearch"
  - name: kibana
    version: "1.0.0"
    repository: "file://../kibana"
