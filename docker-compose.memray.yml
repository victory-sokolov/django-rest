services:
  # Memray does not need the external ELK network. Replace, rather than
  # append to, the base service network lists so Compose never looks it up.
  app:
    networks: !override
      - default
    ports: !override
      - 8001:8001
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8001/health/app"]

  postgres:
    networks: !override
      - default
